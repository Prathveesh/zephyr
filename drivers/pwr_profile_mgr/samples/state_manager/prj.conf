CONFIG_PWR_PROFILE_MGR=y
CONFIG_PWR_PROFILE_MGR_LOG_LEVEL_INF=y
CONFIG_PM=y
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

# Live log over the existing SWD/ST-LINK connection (OpenOCD's rtt
# server) -- this board's ST-LINK VCP is not wired to a UART, so this
# is the debug-console path instead of a real UART.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
